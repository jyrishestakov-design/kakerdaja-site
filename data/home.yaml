# Avaleht. Muudetav adminis: "Avaleht".
sissejuhatus: |
  Kakerdaja on Järvamaa segarahvatantsurühm, kes on tantsinud aastast 1985. Tantsijad tulevad Albust, Jänedalt, Kaalepist ja mujalt ümbruskonnast.

  Tantsime simmanitel, küla- ja kihelkonnapäevadel, laulu- ja tantsupidudel ning kõikjal, kus rahvas tantsu tahab. Pärast esinemist kutsume tihti ka pealtvaatajad ühistantsu.
